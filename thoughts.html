<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>burhan's thoughts!</title>
  <meta name="description" content="thoughts and writing by burhan kapdawala.">
  <style>
    :root {
      --color-bg: #f4f1ea;
      --color-paper: #fffdf8;
      --color-text: #2a2723;
      --color-muted: #6b655c;
      --color-border: #d8d2c4;
      --color-link: #1a5fb4;
      --color-accent: #b45309;
      --shadow-paper: 0 1px 3px rgba(42, 39, 35, 0.08), 0 8px 24px rgba(42, 39, 35, 0.06);
      --duration-spin: 600ms;
    }

    [data-theme="dark"] {
      --color-bg: #1c1b18;
      --color-paper: #26241f;
      --color-text: #e8e4da;
      --color-muted: #a39c8e;
      --color-border: #3b382f;
      --color-link: #7cb2f0;
      --color-accent: #f0a860;
      --shadow-paper: 0 1px 3px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--color-bg);
    }

    body {
      margin: 0;
      font-family: Charter, Georgia, 'Times New Roman', serif;
      font-size: 1.0625rem;
      line-height: 1.65;
      color: var(--color-text);
      background: var(--color-bg);
      transition: background 200ms ease, color 200ms ease;
    }

    .container {
      max-width: 42rem;
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 2.5rem) clamp(0.75rem, 3vw, 1.5rem);
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      padding: 0 0.25rem;
    }

    .name {
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
      user-select: none;
      transition: transform var(--duration-spin) cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .name.spinning {
      transform: rotate(360deg);
    }

    nav {
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    nav a {
      color: var(--color-text);
      text-decoration: none;
      border-bottom: 2px solid var(--color-accent);
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--color-accent);
    }

    #toggleTheme {
      font-size: 1rem;
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 0.15rem 0.45rem;
      cursor: pointer;
      line-height: 1.4;
      transition: transform 150ms ease;
    }

    #toggleTheme:hover {
      transform: scale(1.1);
    }

    .header-rule {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 0.9rem 0 1.4rem;
    }

    .paper {
      background: var(--color-paper);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: var(--shadow-paper);
      padding: clamp(1.25rem, 4vw, 2.25rem);
      transition: background 200ms ease, border-color 200ms ease;
    }

    h2 {
      font-size: 1.2rem;
      margin: 0 0 0.5rem;
      color: var(--color-accent);
    }

    a {
      color: var(--color-link);
    }

    a:hover,
    a:focus-visible {
      color: var(--color-accent);
    }

    .footer-rule {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 1.5rem 0 0.75rem;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--color-muted);
      padding-bottom: 1rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .name,
      #toggleTheme,
      body,
      .paper {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="header">
        <div class="name" id="nameSpinner">burhan kapdawala</div>
        <nav aria-label="Main navigation">
          <a href="index.html">about</a>
          <a href="thoughts.html" aria-current="page">thoughts</a>
          <button id="toggleTheme" aria-label="Toggle color theme">☀️</button>
        </nav>
      </div>
      <hr class="header-rule">
    </header>

    <main class="paper">
      <section aria-labelledby="thoughts-heading">
        <h2 id="thoughts-heading">thoughts</h2>
        <p>
          nothing here yet! i'm still figuring out what's worth writing about.
          probably databases. come back later :)
        </p>
      </section>
    </main>

    <hr class="footer-rule">
    <footer>made with a text editor and mild perfectionism.</footer>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'theme';
      var root = document.documentElement;
      var toggle = document.getElementById('toggleTheme');

      function apply(theme) {
        root.setAttribute('data-theme', theme);
        toggle.textContent = theme === 'dark' ? '🌙' : '☀️';
      }

      var saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { /* private mode */ }
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      apply(saved || (prefersDark ? 'dark' : 'light'));

      toggle.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(next);
        try { localStorage.setItem(STORAGE_KEY, next); } catch (e) { /* private mode */ }
      });

      var name = document.getElementById('nameSpinner');
      name.addEventListener('click', function () {
        if (name.classList.contains('spinning')) return;
        name.classList.add('spinning');
        setTimeout(function () { name.classList.remove('spinning'); }, 650);
      });
    })();
  </script>
</body>
</html>
